name: Build & Package Linux (AMD64)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize timestamps to prevent clock-skew loops
        run: |
          find . -not -path '*/.git/*' -exec touch -m {} +

      - name: Install system and Qt 6 dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            file \
            dpkg-dev \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            qt6-base-dev \
            qt6-base-dev-tools

      - name: Configure with CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=amd64

      - name: Build TnfsTrayApp
        run: |
          cmake --build build --parallel

      - name: Package (.deb and portable .tar.gz)
        run: |
          rm -rf release stage
          mkdir -p release stage

          cp build/TnfsTrayApp stage/

          cd build
          cpack -G DEB
          mv *.deb ../release/
          cd ..

          tar -cvzf release/TnfsTrayApp-linux-amd64-portable.tar.gz -C stage .

      - name: Upload Linux AMD64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TnfsTrayApp-linux-amd64
          path: |
            release/*.deb
            release/TnfsTrayApp-linux-amd64-portable.tar.gz
          if-no-files-found: error
